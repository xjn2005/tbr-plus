name: Binary

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Existing tag to publish"
        required: true
        default: "v2.4.3"

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.version || github.ref }}

      - name: Install GTK
        id: msys2
        uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c # v2.31.1
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-gtk4
            mingw-w64-clang-x86_64-pkgconf

      - name: Add GTK toolchain to PATH
        shell: pwsh
        run: |
          $clang = "${{ steps.msys2.outputs.msys2-location }}\clang64"
          $clangBin = "$clang\bin"
          $clangPkgConfig = "$clang\lib\pkgconfig"
          $clangBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "PKG_CONFIG_PATH=$clangPkgConfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnullvm

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-gnullvm

      - name: Get version
        id: version
        shell: pwsh
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:VERSION_INPUT
          if (-not $version) {
            $version = $env:REF_NAME
          }
          "ver=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "name=tbr-plus-windows-amd64-$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Package
        shell: pwsh
        env:
          BUNDLE_NAME: ${{ steps.version.outputs.name }}
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $bundle = Join-Path $PWD $env:BUNDLE_NAME
          $bundleBin = Join-Path $bundle "bin"
          $bundleLib = Join-Path $bundle "lib"
          $clang = Join-Path $env:MSYS2_ROOT "clang64"
          $clangBin = Join-Path $clang "bin"
          New-Item -ItemType Directory -Path $bundle
          New-Item -ItemType Directory -Path $bundleBin
          New-Item -ItemType Directory -Path $bundleLib
          Copy-Item "target\x86_64-pc-windows-gnullvm\release\tbr-plus.exe" $bundleBin
          Copy-Item "$clangBin\*.dll" $bundleBin
          Copy-Item (Join-Path $clangBin "gdk-pixbuf-query-loaders.exe") $bundleBin
          Copy-Item (Join-Path $clang "lib\gdk-pixbuf-2.0") $bundleLib -Recurse
          Copy-Item (Join-Path $clang "share") $bundle -Recurse
          Copy-Item (Join-Path $clang "etc") $bundle -Recurse
          $launcher = @(
            '@echo off'
            'setlocal'
            'set "TBR_ROOT=%~dp0"'
            'set "PATH=%TBR_ROOT%bin;%SystemRoot%\System32;%SystemRoot%"'
            'set "GDK_PIXBUF_MODULEDIR=%TBR_ROOT%lib\gdk-pixbuf-2.0\2.10.0\loaders"'
            'set "TBR_LOADER_CACHE=%TEMP%\tbr-plus-gdk-pixbuf-loaders-%RANDOM%.cache"'
            'set "GDK_PIXBUF_MODULE_FILE=%TBR_LOADER_CACHE%"'
            '"%TBR_ROOT%bin\gdk-pixbuf-query-loaders.exe" > "%TBR_LOADER_CACHE%"'
            'if errorlevel 1 exit /b %errorlevel%'
            '"%TBR_ROOT%bin\tbr-plus.exe" %*'
            'set "TBR_EXIT=%ERRORLEVEL%"'
            'del "%TBR_LOADER_CACHE%" >nul 2>&1'
            'exit /b %TBR_EXIT%'
          )
          $launcher | Set-Content (Join-Path $bundle "tbr-plus.cmd") -Encoding ascii

      - name: Smoke test packaged application
        shell: pwsh
        env:
          BUNDLE_NAME: ${{ steps.version.outputs.name }}
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $bundle = Join-Path $PWD $env:BUNDLE_NAME
          $launcher = Join-Path $bundle "tbr-plus.cmd"
          $smokeTemp = Join-Path $env:RUNNER_TEMP "tbr-plus-smoke"
          $previousPath = $env:PATH
          $previousTemp = $env:TEMP
          $process = $null
          try {
            New-Item -ItemType Directory -Path $smokeTemp
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            $env:TEMP = $smokeTemp
            $process = Start-Process -FilePath "$env:SystemRoot\System32\cmd.exe" -ArgumentList "/d /c `"$launcher`"" -WorkingDirectory $bundle -PassThru
            Start-Sleep -Seconds 5
            if ($process.HasExited) {
              throw "Packaged application exited during startup with code $($process.ExitCode)"
            }
            $loaderCache = Get-ChildItem $smokeTemp -Filter "tbr-plus-gdk-pixbuf-loaders-*.cache" | Select-Object -First 1
            if (-not $loaderCache) {
              throw "Packaged application did not generate a GdkPixbuf loader cache"
            }
            $loaderCacheContent = Get-Content -Raw $loaderCache.FullName
            if ($loaderCacheContent -match [regex]::Escape($env:MSYS2_ROOT)) {
              throw "GdkPixbuf loader cache still references the runner's MSYS2 installation"
            }
            if ($loaderCacheContent -notmatch [regex]::Escape($bundle)) {
              throw "GdkPixbuf loader cache does not reference the packaged loaders"
            }
          } finally {
            if ($process -and -not $process.HasExited) {
              & "$env:SystemRoot\System32\taskkill.exe" /PID $process.Id /T /F *> $null
            }
            $env:PATH = $previousPath
            $env:TEMP = $previousTemp
          }

      - name: Zip
        shell: pwsh
        env:
          BUNDLE_NAME: ${{ steps.version.outputs.name }}
        run: Compress-Archive -Path $env:BUNDLE_NAME -DestinationPath "$env:BUNDLE_NAME.zip"

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.ver }}
          RELEASE_ARCHIVE: ${{ steps.version.outputs.name }}.zip
        run: |
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $env:RELEASE_ARCHIVE --clobber
          } else {
            gh release create $env:RELEASE_TAG $env:RELEASE_ARCHIVE --verify-tag --generate-notes --title $env:RELEASE_TAG
          }
